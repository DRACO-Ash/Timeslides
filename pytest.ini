[pytest]
testpaths = tests
# Bare --cov, not --cov=timeslides.
#
# A --cov with an argument overrides the `source` in .coveragerc, and the two
# then disagree about what the report is rooted at: the config says the project
# root and names files `timeslides/api.py`, while the command line says the
# package and names them `api.py`. The scanner reads whichever the pipeline
# happened to produce. One source of truth, and it is .coveragerc, which is
# also where the reason is written down.
addopts = -q --cov --cov-report=term-missing --cov-report=xml
markers =
    browser: end-to-end tests that drive a real browser (Playwright)
